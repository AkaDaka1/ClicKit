# Tempo ClicKit Cloud (M8 T2.1): приём и локальное хранение трейсов.
#
# API шлёт спаны по OTLP/HTTP на `http://tempo:4318` (T1.3, ADR №63);
# `CLICKIT_OTEL_ENDPOINT` в compose наблюдаемости указывает именно сюда.
# Хранилище — локальный диск в именованном томе `tempo-data`, single binary.
# Grafana читает трейсы через HTTP-порт 3200 (datasource Tempo).

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        # gRPC — на случай будущих инструментаций; HTTP — путь сервиса.
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Retention не настраивается: в Tempo 3.x компакция живёт в scheduler/worker,
# а top-level `compactor` удалён из схемы. Дефолт `block_retention` — 336h
# (14 дней), ровно то, что нужно локальному стеку (трейсы — для свежих
# инцидентов; 30-дневное окно относится к метрикам SLO).

usage_report:
  reporting_enabled: false
