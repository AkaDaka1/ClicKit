# Promtail ClicKit Cloud (M8 T2.1): логи API → Loki.
#
# Источник — Docker API (`docker_sd_configs`): Promtail находит контейнеры
# через `/var/run/docker.sock` и читает их stdout/stderr. Это работает и на
# Docker Desktop (Windows/WSL2), где путь `/var/lib/docker/containers` не
# является обычным каталогом хоста.
#
# Метки потока — только низкой кардинальности: `container`, `service`,
# `stream`, `level` (ADR №62 о кардинальности меток). `request_id` и
# `trace_id` остаются в теле JSON-строки и в structured metadata, но НЕ
# становятся метками: иначе Loki создаст поток на каждый запрос.
#
# Promtail — LTS с EOL в 2026 (Grafana переводит агентов на Alloy). План M8
# §3 фиксирует Promtail; миграция на Alloy — отдельное решение после вехи.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  # Позиции чтения переживают перезапуск контейнера.
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: clikit-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          # Только контейнеры этого compose-проекта и только сервис API:
          # инфраструктура наблюдаемости сама себя не собирает — иначе Loki
          # писал бы журнал о собственных записях и получился бы цикл.
          - name: label
            values: ["com.docker.compose.project=clikit-observability"]
          - name: label
            values: ["com.docker.compose.service=api"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_id"]
        target_label: container_id
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      # JSON-журнал сервиса (ADR №61): уровень становится меткой, остальные
      # поля остаются в строке и доступны в LogQL (`| json`).
      - json:
          expressions:
            level: level
            logger: logger
      - labels:
          level:
      - structured_metadata:
          request_id:
          trace_id:
