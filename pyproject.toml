[project]
name = "clickit"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "core", "gui", "bridge"]

[tool.pytest.ini_options]
# Корень проекта в sys.path: тесты импортируют `app`, `core`, `gui`, `tests.*`.
pythonpath = ["."]
testpaths = ["tests"]
