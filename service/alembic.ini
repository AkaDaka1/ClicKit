# Alembic для ClicKit Cloud.
# Запуск из корня репозитория:
#   CLICKIT_DB_URL=postgresql+psycopg://clikit:clikit@localhost:5432/clikit \
#     alembic -c service/alembic.ini upgrade head
# URL БД читается из окружения в service/migrations/env.py (секретов в файле нет).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
